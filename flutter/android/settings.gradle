pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"

// Keep legacy Flutter plugins buildable with AGP 8+, which requires an explicit
// namespace even when the plugin still declares its package in AndroidManifest.xml.
gradle.beforeProject { project ->
    project.plugins.withId("com.android.library") {
        if (project.android.namespace == null) {
            def manifest = project.file("src/main/AndroidManifest.xml")
            if (manifest.exists()) {
                def packageName = new XmlSlurper().parse(manifest).@package.text()
                if (packageName) {
                    project.android.namespace = packageName
                }
            }
        }
    }
}
