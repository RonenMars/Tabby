name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"

jobs:
  flutter-analyze-and-test:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.41.8"

      # generated_bridge.freezed.dart is gitignored. build_runner writes it
      # from the @freezed types in the tracked generated_bridge.dart so
      # analyze and test can compile without waiting on the Rust bridge job.
      - name: Analyze and test
        working-directory: flutter
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
          flutter test

  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
